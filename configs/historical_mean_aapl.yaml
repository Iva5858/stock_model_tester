experiment:
  name: historical_mean_aapl
  description: "Prevailing mean baseline (Goyal-Welch 2008) on AAPL daily returns"

data:
  loader: yfinance
  ticker: AAPL
  start: "2004-01-01"
  end: "2024-01-01"
  missing: ffill

features:
  target: next_return
  lags: [1, 2, 3, 5, 10]
  rolling_windows: [5, 10, 20]
  technical_indicators: false

model:
  name: HistoricalMean
  params: {}

evaluation:
  test_size: 0.2
  metrics: [rmse, mae, r2, directional_accuracy, sharpe, oos_r2, rank_ic, max_drawdown, calmar_ratio]

seed: 42
