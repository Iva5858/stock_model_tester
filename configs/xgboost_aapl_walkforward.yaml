experiment:
  name: xgboost_aapl_walkforward
  description: "XGBoost on AAPL — expanding-window walk-forward CV (monthly refits)"

data:
  loader: yfinance
  ticker: AAPL
  start: "2004-01-01"
  end: "2024-01-01"
  missing: ffill

features:
  target: next_return
  lags: [1, 2, 3, 5, 10]
  rolling_windows: [5, 10, 20]
  technical_indicators: true

model:
  name: XGBoost
  params:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8

evaluation:
  cv_method: expanding          # walk-forward: train grows from 2004 outward
  min_train_size: 500           # ~2 years initial training window
  step_size: 21                 # refit every ~21 trading days (monthly)
  metrics: [rmse, mae, r2, directional_accuracy, sharpe, oos_r2, rank_ic, max_drawdown, calmar_ratio]

seed: 42
