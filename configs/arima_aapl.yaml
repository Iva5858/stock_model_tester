experiment:
  name: arima_aapl
  description: "ARIMA(5,0,0) on AAPL daily returns"

data:
  loader: yfinance
  ticker: AAPL
  start: "2004-01-01"
  end: "2024-01-01"

features:
  target: next_return
  lags: [1, 2, 3, 5, 10]
  rolling_windows: [5, 10, 20]
  technical_indicators: false

model:
  name: ARIMA
  params:
    p: 5
    d: 0
    q: 0

evaluation:
  test_size: 0.2
  metrics: [rmse, mae, r2, directional_accuracy, sharpe]

seed: 42
