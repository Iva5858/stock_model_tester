experiment:
  name: garch_aapl
  description: "ARMA(1)-GARCH(1,1) on AAPL daily returns — models conditional mean"

data:
  loader: yfinance
  ticker: AAPL
  start: "2004-01-01"
  end: "2024-01-01"

features:
  target: next_return
  lags: [1, 2, 3, 5, 10]
  rolling_windows: [5, 10, 20]
  technical_indicators: false

model:
  name: GARCH
  params:
    p: 1
    q: 1
    mean: AR
    lags: 1

evaluation:
  test_size: 0.2
  metrics: [rmse, mae, r2, directional_accuracy, sharpe]

seed: 42
