experiment:
  name: elasticnet_aapl
  description: "ElasticNet on AAPL daily returns"

data:
  loader: yfinance
  ticker: AAPL
  start: "2004-01-01"
  end: "2024-01-01"

features:
  target: next_return
  lags: [1, 2, 3, 5, 10]
  rolling_windows: [5, 10, 20]
  technical_indicators: true

model:
  name: ElasticNet
  params:
    alpha: 0.0001
    l1_ratio: 0.5

evaluation:
  test_size: 0.2
  metrics: [rmse, mae, r2, directional_accuracy, sharpe]

seed: 42
